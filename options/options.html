<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Litterbox - Post Peeker</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; min-width: 300px; color: #0f1419; background: #fff; font-size: 14px; }
    h1 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
    .tag { font-size: 12px; color: #536471; margin: 0 0 14px; }
    label.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
    select { font: inherit; }
    .hint { font-size: 12px; color: #536471; margin-top: 12px; line-height: 1.4; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #1d9bf0; vertical-align: middle; }
    @media (prefers-color-scheme: dark) {
      body { background: #15202b; color: #f7f9f9; }
      .tag, .hint { color: #8b98a5; }
    }
  </style>
</head>
<body>
  <h1>Litterbox <span class="dot"></span></h1>
  <p class="tag">x.com without visiting x.com</p>

  <label class="row"><span>Enable post peeking</span><input type="checkbox" id="enabled"></label>
  <label class="row"><span>Mark openable links with a dot</span><input type="checkbox" id="showDots"></label>
  <label class="row"><span>Popup theme</span>
    <select id="theme">
      <option value="auto">Match system</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </label>

  <p class="hint">Click a post link to peek. Ctrl/Cmd, Shift, Alt, or middle-click opens the link normally. Press Esc to close. No cookies are ever sent to X.</p>
  <script src="options.js"></script>
</body>
</html>
